name: Opções no dinheiro

# Ferramenta de consulta: não grava acervo nem interfere no coletor.
# Cada execução é independente.
on:
  workflow_dispatch:
    inputs:
      ativo:
        description: "Ativo (ex.: PETR4, VALE3, BBAS3). Vazio = PETR4."
        required: false
        type: string
      faixa:
        description: "Faixa em torno do preço, em % (ex.: 10). Vazio = 10."
        required: false
        type: string
      min_negocios:
        description: "Descartar séries com menos negócios que isto. Vazio = 0."
        required: false
        type: string
      estilo:
        description: "Na B3, calls são americanas e puts europeias — filtrar corta um lado"
        required: false
        default: todos
        type: choice
        options: [todos, american, european]

env:
  TZ: America/Sao_Paulo

concurrency:
  group: opcoes-agora
  cancel-in-progress: true

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consultar
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: |
          ATIVO="${{ inputs.ativo || 'PETR4' }}"
          FAIXA=$(python -c "print(${{ inputs.faixa || 10 }}/100)")
          python selecionar_opcoes.py \
            --underlying "$ATIVO" \
            --faixa "$FAIXA" \
            --estilo "${{ inputs.estilo || 'todos' }}" \
            --min-negocios "${{ inputs.min_negocios || 0 }}" \
            --html "opcoes_$ATIVO.html" \
            -v

      - name: Publicar tabela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcoes-${{ inputs.ativo || 'PETR4' }}
          path: opcoes_*.html
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
